[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dl-origination"
version = "0.1.0"
description = "Direct-lending origination target mining platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.28",
    "redis>=5.2",
    "arq>=0.26",
    "openpyxl>=3.1",
    "rapidfuzz>=3.10",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "httpx",
    "aiosqlite>=0.20",
]

[project.scripts]
dl-origination = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/ai/prompts/*.py" = ["E501"]  # Prompt templates have long string literals

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
